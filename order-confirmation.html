<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order Confirmed | E-Pharms</title><link rel="stylesheet" href="css/bootstrap.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body class="pharmacy-app-page" data-page="confirmation"><header class="app-header"><a class="app-brand" href="home.html"><span>EP</span> E-Pharms</a><nav class="app-nav"><a href="home.html">Home</a><a href="buy.html">Shop</a><a href="prescription.html">Prescription</a><a href="orders.html">My Orders</a><a class="app-cart-link" href="cart.html">Cart <b data-cart-count>0</b></a></nav></header><main class="app-main"><section class="confirmation-panel" data-order-confirmation><div class="confirmation-mark">✓</div><p class="eyebrow">Order received</p><h1>Order placed successfully</h1><p>We have saved your demo order. Prescription-only items remain pending pharmacist verification.</p><div class="order-confirmation-details" data-order-details>Loading order details...</div><div class="results-actions"><a class="app-button app-button-primary" href="orders.html">Track order</a><a class="app-button app-button-quiet" href="buy.html">Continue shopping</a></div></section></main><script>document.addEventListener('DOMContentLoaded', async () => { const target = document.querySelector('[data-order-details]'); const code = new URLSearchParams(location.search).get('code'); try { const response = await fetch(`/api/orders/${code}`); const order = await response.json(); if (!response.ok) throw new Error(order.message); target.innerHTML = `<div><span>Order ID</span><strong>${order.order_code}</strong></div><div><span>Total</span><strong>₹${Number(order.total).toFixed(2)}</strong></div><div><span>Delivery</span><strong>${order.city}, ${order.state} - ${order.pin_code}</strong></div><div><span>Status</span><strong>${order.status.replaceAll('_', ' ')}</strong></div><div><span>Prescription</span><strong>${order.prescription_status.replaceAll('_', ' ')}</strong></div><ul>${order.items.map((item) => `<li>${item.medicine_name} × ${item.quantity}</li>`).join('')}</ul>`; } catch (error) { target.textContent = error.message; } });</script><script src="js/app.js"></script></body></html>
