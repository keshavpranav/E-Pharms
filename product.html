<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Medicine Details | E-Pharms</title><link rel="stylesheet" href="css/bootstrap.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body class="pharmacy-app-page" data-page="product"><header class="app-header"><a class="app-brand" href="home.html"><span>EP</span> E-Pharms</a><nav class="app-nav"><a href="home.html">Home</a><a class="active" href="buy.html">Shop</a><a href="prescription.html">Prescription</a><a href="orders.html">My Orders</a><a class="app-cart-link" href="cart.html">Cart <b data-cart-count>0</b></a></nav></header><main class="app-main"><div class="product-detail" data-product-detail><p>Loading medicine details...</p></div></main><script>document.addEventListener('DOMContentLoaded', async () => { const target = document.querySelector('[data-product-detail]'); const id = new URLSearchParams(location.search).get('id'); try { const response = await fetch(`/api/medicines/${id}`); const medicine = await response.json(); if (!response.ok) throw new Error(medicine.message); const price = (medicine.price * (1 - medicine.discount / 100)).toFixed(2); target.innerHTML = `<div class="product-image-panel"><img src="${medicine.image}" alt="${medicine.name}"></div><div class="product-copy"><p class="eyebrow">${medicine.category}</p><h1>${medicine.name}</h1><p class="product-subtitle">${medicine.generic_name} · ${medicine.strength} · ${medicine.dosage_form}</p><p>${medicine.description}</p><dl class="product-facts"><div><dt>Manufacturer</dt><dd>${medicine.manufacturer}</dd></div><div><dt>Stock</dt><dd>${medicine.stock_quantity ? `${medicine.stock_quantity} available` : 'Out of stock'}</dd></div><div><dt>Price</dt><dd>₹${price}</dd></div></dl>${medicine.prescription_required ? '<div class="prescription-warning">Prescription required. This demo keeps the product visible but requires prescription review before ordering.</div>' : ''}<h2>Usage information</h2><p>${medicine.usage_information}</p><button class="app-button app-button-primary" data-product-add ${medicine.stock_quantity < 1 || medicine.prescription_required ? 'disabled' : ''}>${medicine.prescription_required ? 'Upload prescription to order' : 'Add to cart'}</button><a class="app-button app-button-quiet" href="buy.html">Back to shop</a></div>`; document.querySelector('[data-product-add]').addEventListener('click', () => { const cart = JSON.parse(localStorage.getItem('epharms-cart') || '[]'); const existing = cart.find((item) => item.medicine_id === medicine.id); if (existing) existing.quantity += 1; else cart.push({ medicine_id: medicine.id, name: medicine.name, strength: medicine.strength, price: medicine.price, discount: medicine.discount, image: medicine.image, prescription_required: medicine.prescription_required, stock_quantity: medicine.stock_quantity, quantity: 1, from_prescription: false }); localStorage.setItem('epharms-cart', JSON.stringify(cart)); location.href = 'cart.html'; }); } catch (error) { target.innerHTML = `<div class="empty-state"><h2>${error.message}</h2><a href="buy.html" class="app-button app-button-primary">Back to shop</a></div>`; } });</script><script src="js/app.js"></script></body></html>
